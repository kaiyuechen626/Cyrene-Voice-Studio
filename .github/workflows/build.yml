name: Android source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check public source files
        run: python3 tools/verify_public_source.py --staged
      - name: Prepare pinned Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Download and verify official runtime
        run: python3 tools/fetch_dependency.py
      - name: Build, unit tests and Android Lint
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleRelease :app:lintDebug
      - name: Verify release JNI callback
        run: python3 tools/verify_native_callback.py app/build/outputs/apk/release/app-release-unsigned.apk
